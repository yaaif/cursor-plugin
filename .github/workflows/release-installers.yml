name: release-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Build artifacts only (do not attach to a GitHub Release)"
        type: boolean
        default: true

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Build MCP bundle
        working-directory: packages/mcp
        run: npm ci && npm run build
      - name: Build pkg and dmg
        run: ./installer/macos/build-pkg.sh --arch ${{ matrix.arch }}
      - name: Smoke-install native pkg
        if: matrix.arch == 'arm64'
        run: |
          export YAAIF_INSTALLER_NO_OPEN=1
          PKG=$(ls installer/out/dist/yaaif-cursor-plugin-*-macos-arm64.pkg)
          sudo installer -pkg "$PKG" -target /
          test -f "$HOME/.cursor/plugins/local/yaaif/dist/yaaif-cursor-mcp.mjs"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.cursor/plugins/local/yaaif/mcp.json")
          cmd = json.load(open(p))["mcpServers"]["yaaif"]["command"]
          assert cmd.startswith("/"), cmd
          print("mcp command", cmd)
          PY
          test -f "$HOME/.yaaif/cursor/NEXT_STEPS.html"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: installer/out/dist/*

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Build MCP bundle
        working-directory: packages/mcp
        run: npm ci && npm run build
      - name: Build deb
        run: ./installer/linux/build-deb.sh --arch ${{ matrix.arch }}
      - name: Smoke-install native deb
        if: matrix.arch == 'amd64'
        run: |
          export YAAIF_INSTALLER_NO_OPEN=1
          mkdir -p "$HOME/.yaaif/cursor"
          echo '{"keep":true}' > "$HOME/.yaaif/cursor/session.json"
          sudo env YAAIF_INSTALLER_NO_OPEN=1 dpkg -i installer/out/dist/yaaif-cursor-plugin-*-linux-amd64.deb
          test -f "$HOME/.cursor/plugins/local/yaaif/dist/yaaif-cursor-mcp.mjs"
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.cursor/plugins/local/yaaif/mcp.json")
          cmd = json.load(open(p))["mcpServers"]["yaaif"]["command"]
          assert cmd.startswith("/"), cmd
          print("mcp command", cmd)
          PY
          sudo dpkg -r yaaif-cursor-plugin
          test ! -e "$HOME/.cursor/plugins/local/yaaif"
          test -f "$HOME/.yaaif/cursor/session.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: installer/out/dist/*

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: Build MCP bundle
        working-directory: packages/mcp
        run: npm ci && npm run build
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: ./installer/windows/build-msi.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-${{ matrix.arch }}
          path: |
            installer/out/dist/*.msi
            installer/out/dist/SHA256SUMS
      - name: Smoke-install native MSI
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:YAAIF_INSTALLER_NO_OPEN = "1"
          $msi = Get-Item installer/out/dist/yaaif-cursor-plugin-*-win-x64.msi
          $log = Join-Path $env:RUNNER_TEMP "msiexec-install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 80
            throw "msiexec install failed: $($p.ExitCode)"
          }
          $dest = Join-Path $env:USERPROFILE ".cursor\plugins\local\yaaif\dist\yaaif-cursor-mcp.mjs"
          if (-not (Test-Path $dest)) { throw "plugin dest missing" }
          $mcp = Get-Content (Join-Path $env:USERPROFILE ".cursor\plugins\local\yaaif\mcp.json") -Raw | ConvertFrom-Json
          if ($mcp.mcpServers.yaaif.command -notmatch '[:\\]') { throw "expected absolute node path" }
          $sessionDir = Join-Path $env:USERPROFILE ".yaaif\cursor"
          New-Item -ItemType Directory -Force -Path $sessionDir | Out-Null
          Set-Content (Join-Path $sessionDir "session.json") '{"keep":true}'
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall failed: $($u.ExitCode)" }
          if (Test-Path (Join-Path $env:USERPROFILE ".cursor\plugins\local\yaaif")) { throw "plugin dir should be gone" }
          if (-not (Test-Path (Join-Path $sessionDir "session.json"))) { throw "session.json must be kept" }

  publish:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_publish == false) }}
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Push to GitHub Packages (GHCR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x installer/scripts/publish-ghcr.sh
          installer/scripts/publish-ghcr.sh dist "$VERSION"
